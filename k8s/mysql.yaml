apiVersion: v1
kind: Service
metadata:
  name: docatdoor-db
  labels:
    app.kubernetes.io/name: docatdoor-db
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: docatdoor-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docatdoor-mysql-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: docatdoor-db
spec:
  serviceName: docatdoor-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docatdoor-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docatdoor-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: docatdoor
            - name: MYSQL_USER
              value: docatdoor
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docatdoor-secrets
                  key: db-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docatdoor-secrets
                  key: mysql-root-password
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: docatdoor-mysql-data
